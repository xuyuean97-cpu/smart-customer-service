<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>用户登录</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .card {
      background: #fff;
      width: 360px;
      padding: 24px;
      border-radius: 8px;
      box-shadow: 0 4px 12px rgba(0,0,0,.1);
    }

    h2 {
      text-align: center;
      margin-bottom: 20px;
    }

    .tabs {
      display: flex;
      margin-bottom: 16px;
    }

    .tabs button {
      flex: 1;
      padding: 8px;
      border: none;
      background: #eee;
      cursor: pointer;
    }

    .tabs button.active {
      background: #409eff;
      color: #fff;
    }

    .form-group {
      margin-bottom: 12px;
    }

    input {
      width: 100%;
      padding: 8px;
      box-sizing: border-box;
    }

    button.submit {
      width: 100%;
      padding: 10px;
      background: #409eff;
      border: none;
      color: white;
      cursor: pointer;
      border-radius: 4px;
    }

    .code-row {
      display: flex;
      gap: 8px;
    }

    .code-row button {
      width: 120px;
      background: #67c23a;
      color: white;
      border: none;
      cursor: pointer;
    }

    .msg {
      margin-top: 10px;
      text-align: center;
      color: red;
    }
  </style>
</head>
<body>

<div class="card">
  <h2>用户登录</h2>

  <div class="tabs">
    <button id="tabPwd" class="active">密码登录</button>
    <button id="tabCode">验证码登录</button>
  </div>

  <div class="form-group">
    <input id="phone" placeholder="手机号" />
  </div>

  <div class="form-group" id="pwdBox">
    <input id="password" type="password" placeholder="密码" />
  </div>

  <div class="form-group code-row" id="codeBox" style="display:none;">
    <input id="code" placeholder="验证码" />
    <button onclick="sendCode()">获取验证码</button>
  </div>

  <button class="submit" onclick="login()">登录</button>

  <div class="msg" id="msg"></div>
</div>

<script>
  let loginType = "password";

  const tabPwd = document.getElementById("tabPwd");
  const tabCode = document.getElementById("tabCode");
  const pwdBox = document.getElementById("pwdBox");
  const codeBox = document.getElementById("codeBox");
  const msgBox = document.getElementById("msg");

  tabPwd.onclick = () => switchType("password");
  tabCode.onclick = () => switchType("code");

  function switchType(type) {
    loginType = type;
    msgBox.innerText = "";

    tabPwd.classList.toggle("active", type === "password");
    tabCode.classList.toggle("active", type === "code");

    pwdBox.style.display = type === "password" ? "block" : "none";
    codeBox.style.display = type === "code" ? "flex" : "none";
  }

  async function login() {
    msgBox.innerText = "";

    const phone = document.getElementById("phone").value;
    const password = document.getElementById("password").value;
    const code = document.getElementById("code").value;

    const payload = {
      phone,
      login_type: loginType
    };

    if (loginType === "password") payload.password = password;
    if (loginType === "code") payload.code = code;

    try {
      const res = await fetch("/api/auth/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });

      const data = await res.json();

      if (!res.ok) {
        msgBox.innerText = data.detail || "登录失败";
        return;
      }
      // 1. 将 Token 存入本地存储
      localStorage.setItem('access_token', data.access_token);
      console.log("Access Token:", data.access_token);
      // 2. (可选) 保存用户 ID 或其他信息
      if(data.user_id) localStorage.setItem('user_id', data.user_id);
      msgBox.style.color = "green";
      msgBox.innerText = "登录成功！";

      console.log("TOKEN:", data.access_token);

    } catch (e) {
      msgBox.innerText = "网络错误";
    }
  }

  async function sendCode() {
    const phone = document.getElementById("phone").value;
    if (!phone) {
      msgBox.innerText = "请输入手机号";
      return;
    }

    // ⚠️ 这里假设你有发验证码接口
    await fetch("/api/auth/send-code", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ phone })
    });

    msgBox.style.color = "green";
    msgBox.innerText = "验证码已发送（模拟）";
  }
</script>

</body>
</html>
