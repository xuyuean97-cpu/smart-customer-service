    <header class="header">

          <span>{{ isConnected ? '已连接' : '连接中...' }}</span>
        </div>
      </div>
    </header>

    <div class="chat-container">
      <!-- 消息显示区 -->
      <div class="messages-area" ref="scrollBox">

          <h2>👋 您好！我是智能客服</h2>
          <p>我可以帮您查询订单、办理业务、解答疑问等。请问有什么可以帮您？</p>
          <div class="quick-questions">
            <div v-for="q in quickQs" :key="q.text" @click="sendQuick(q.text)" class="quick-question">
              <div class="quick-question-icon">{{ q.icon }}</div>
              <div class="quick-question-text">{{ q.text }}</div>
            </div>
          </div>
        </div>

        <!-- 动态消息列表 -->
        <div v-for="(msg, index) in messages" :key="index" :class="['message', msg.sender]">
          <div class="message-avatar">{{ msg.sender === 'user' ? '👤' : '🤖' }}</div>
          
          <div class="message-content">
            <!-- 1. 普通文本/流式文本 -->
            <div v-if="msg.type === 'text'" class="text-box">{{ msg.content }}</div>

            <!-- 2. 图片内容 -->
            <div v-if="msg.type === 'image'" class="image-box">
              <img :src="msg.content" alt="用户上传" />
            </div>

            <!-- 3. 富文本 (带图文) -->
            <div v-if="msg.type === 'rich_content'" class="rich-box">
              <p>{{ msg.content.text }}</p>
              <div class="rich-imgs">
                <img v-for="(img, i) in msg.content.images" :key="i" :src="img.data" :alt="img.alt_text" />
              </div>
            </div>

            <!-- 4. 订单列表 -->
            <div v-if="msg.type === 'flight_list'" class="flight-box">
              <div class="flight-title"><strong>{{ msg.content.title }}</strong></div>
              <div class="flight-list">
                <div v-for="(flight, i) in msg.content.flights" :key="i" class="flight-item">

                    </span>
                  </div>

                <select v-if="field.type === 'select'">

                </select>
              </div>

              </div>
            </div>

          <div class="rec-chips">

            <div v-else v-for="q in recQuestions" :key="q" @click="sendQuick(q)" class="rec-chip">{{ q }}</div>
          </div>
        </div>

             <div v-else v-for="b in recBusiness" :key="b" @click="sendQuick(b)" class="rec-chip business">{{ b }}</div>
          </div>
        </div>

      <div class="input-area">

              rows="1"
              ref="inputField"
            ></textarea>
            <div class="input-actions">
              <button class="icon-btn" @click="$refs.imgInput.click()">📷</button>
              <input type="file" ref="imgInput" hidden accept="image/*" @change="handleImage">
            </div>
            <!-- 图片预览 -->
            <div v-if="imagePreview" class="preview-box">
              <img :src="imagePreview" />
              <button class="close-btn" @click="imagePreview = null">×</button>
            </div>
          </div>
          <button class="send-btn" @click="sendMessage" :disabled="!canSend">
            发送 📤
          </button>
        </div>

<script setup>
import { ref, onMounted, onUnmounted, nextTick, computed, watch } from 'vue';

// --- 数据状态 ---
const isConnected = ref(false);
const isTyping = ref(false);
const recLoading = ref(false);
const userInput = ref('');
const imagePreview = ref(null);
const messages = ref([]);
const recQuestions = ref([]);
const recBusiness = ref([]);
const scrollBox = ref(null);

const quickQs = [
  { icon: '✈️', text: '订单与物流查询' },
  { icon: '🧳', text: '修改订单' },
  { icon: '🎫', text: '商品导购与推荐' }
];

// --- WebSocket 逻辑 ---
let ws = null;
const threadId = `thread_${Date.now()}`;
const userId = localStorage.getItem('user_id') || 'guest';
const token = localStorage.getItem('access_token');

const initWS = () => {
  ws = new WebSocket('ws://localhost:8081/api/v1/ecommerce-assistant/chat/ws');
  
  ws.onopen = () => { isConnected.value = true; };
  ws.onclose = () => { 
    isConnected.value = false; 
    setTimeout(initWS, 3000); 
  };

  ws.onmessage = (event) => {
    const { event: evType, data } = JSON.parse(event.data);
    handleServerMessage(evType, data);
  };
};

const handleServerMessage = (type, data) => {
  switch (type) {
    case 'start':
      isTyping.value = false;
      messages.value.push({ sender: 'assistant', type: 'text', content: '' });
      break;
    case 'text':
      // 流式文本追加到最后一条消息
      const lastMsg = messages.value[messages.value.length - 1];
      if (lastMsg && lastMsg.sender === 'assistant') {
        lastMsg.content += data.content.text;
      }
      break;
    case 'rich_content':
      messages.value.push({ sender: 'assistant', type: 'rich_content', content: data.content });
      break;
    case 'flight_list':
      messages.value.push({ sender: 'assistant', type: 'flight_list', content: data.content });
      break;
    case 'form':
      messages.value.push({ sender: 'assistant', type: 'form', content: data.content });
      break;
    case 'transfer_to_human':
      messages.value.push({ sender: 'assistant', type: 'transfer', content: data.content.text });
      break;
    case 'end':
      fetchRecommendations(messages.value[messages.value.length - 2]?.content);
      break;
    case 'error':
      isTyping.value = false;
      messages.value.push({ sender: 'assistant', type: 'text', content: `⚠️ 错误: ${data.content.error_message}` });
      break;
  }
};

// --- 业务逻辑 ---
const sendMessage = () => {
  if (!canSend.value) return;

  const content = userInput.value;
  if (content) messages.value.push({ sender: 'user', type: 'text', content });
  if (imagePreview.value) messages.value.push({ sender: 'user', type: 'image', content: imagePreview.value });

  ws.send(JSON.stringify({
    thread_id: threadId,
    user_id: userId,
    query: content,
    image: imagePreview.value,
    token: token,
    metadata: { query_source: "web" }
  }));

  userInput.value = '';
  imagePreview.value = null;
  isTyping.value = true;
};

const sendQuick = (text) => {
  userInput.value = text;
  sendMessage();
};

const fetchRecommendations = async (lastQuery) => {
  recLoading.value = true;
  try {
    const res = await fetch('http://localhost:8081/api/v1/question-recommend/questions', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ thread_id: threadId, query: lastQuery })
    });
    const data = await res.json();
    recQuestions.value = data.item?.recommended_questions || [];
    // 模拟业务推荐数据
    recBusiness.value = ["在线发货", "延误证明", "失物招领"];
  } finally {
    recLoading.value = false;
  }
};

const handleImage = (e) => {
  const file = e.target.files[0];
  const reader = new FileReader();
  reader.onload = (ev) => { imagePreview.value = ev.target.result; };
  reader.readAsDataURL(file);
};

const handleEnter = (e) => {
  if (!e.shiftKey) sendMessage();
};

const canSend = computed(() => isConnected.value && (userInput.value.trim() || imagePreview.value));

// --- 辅助功能 ---
const scrollToBottom = () => {
  nextTick(() => {
    if (scrollBox.value) {
      scrollBox.value.scrollTo({
        top: scrollBox.value.scrollHeight,
        behavior: 'smooth'
      });
    }
  });
};

watch(messages, scrollToBottom, { deep: true });

onMounted(() => {
  initWS();
});

onUnmounted(() => {
  if (ws) ws.close();
});
</script>
